feature: "Полноценный редактор новостей в админке"
branch: "master"
created: "2026-09-14"
status: "Draft"
input: >-
  Полноценный редактор новостей в админке ФК Арсенал-92: админ сайта должен сам создавать новости
  качества не ниже программно созданных. Текущее состояние: редактор /admin/news даёт только Заголовок,
  Краткое описание и tiptap StarterKit с кнопками B/I/H2/List. Эталон качества (существующие 9 новостей
  на проде): обложка coverImage (S3-URL), абзацы <p> с <strong>, grid-галерея фото, блок видео
  (<video controls preload="metadata" playsinline><source type="video/mp4">), массив тегов. Требуется:
  (1) загрузка обложки новости с превью и заменой/удалением; (2) вставка в контент галереи из нескольких
  фото одной операцией и вставка видео-блока — загрузка на S3 через admin-эндпоинт загрузки медиа;
  (3) alt-текст на русском для каждого изображения (SEO); (4) редактирование тегов, slug (автогенерация
  из заголовка + ручная правка, только [a-z0-9-]), metaTitle (<=160) и metaDescription (<=300),
  переключатель публикации; (5) содержимое, сохранённое редактором, должно рендериться на /novosti/[slug]
  визуально идентично программно созданным новостям — галереи и видео не должны теряться при сохранении
  и повторном открытии; (6) редактирование существующей новости не должно затирать её обложку, теги и
  статус публикации. Известные пробелы: CreateNewsCommand не принимает CoverImage; эндпоинт загрузки
  жёстко ставит тип Image и создаёт запись в публичной фотогалерее; лимит 20 МБ на файл, хранилище S3.

user_stories:
  - id: "US1"
    title: "Обложка новости"
    priority: "P1"
    description: >-
      Администратор загружает обложку новости прямо в редакторе, видит превью, может заменить или удалить её —
      как при создании новой новости, так и при редактировании существующей.
    motivation:
      problem: >-
        Редактор не позволяет задать обложку вообще; при создании новости обложка не сохраняется даже
        технически, поэтому созданная админом новость выглядит в списке и в соцсетях пустой карточкой.
      value: >-
        Каждая новость, созданная администратором, получает обложку — как у новостей, опубликованных
        программно, включая превью в списке новостей и картинку в Open Graph при репосте.
      consequence_if_skipped: >-
        Админ вынужден просить разработчика добавить обложку, новости остаются визуально неполноценными.
    why_priority: >-
      Обложка видна на всех витринах новости (список, главная, репост) — без неё паритет с эталоном
      недостижим, и это единственный пункт, заблокированный на стороне сервера.
    independent_test: >-
      Создать новость с обложкой через админку, открыть список новостей и публичную страницу новости —
      обложка отображается в обоих местах; повторно открыть новость на редактирование — превью обложки на месте.
    acceptance_scenarios:
      - id: "AS-1"
        given: "Администратор в форме создания новой новости"
        when: "Он выбирает файл изображения в поле обложки"
        then: "Появляется превью загруженной обложки, и после сохранения новость имеет эту обложку"
      - id: "AS-2"
        given: "Открыта на редактирование новость с уже заданной обложкой"
        when: "Администратор сохраняет новость, не трогая поле обложки"
        then: "Обложка остаётся прежней"
      - id: "AS-3"
        given: "Открыта на редактирование новость с обложкой"
        when: "Администратор нажимает удаление обложки и сохраняет"
        then: "Новость сохраняется без обложки, и интерфейс не показывает битое изображение"
    acceptance_criteria:
      - id: "AC-1"
        description: "Форма создания новости содержит поле загрузки обложки с превью результата"
        done: false
      - id: "AC-2"
        description: "Обложка, заданная при создании, сохраняется вместе с новостью и видна после перезагрузки списка"
        done: false
      - id: "AC-3"
        description: "Обложку можно заменить другим файлом и удалить полностью"
        done: false
      - id: "AC-4"
        description: "Сохранение новости без изменения поля обложки не стирает существующую обложку"
        done: false
    test_scenarios:
      - id: "TS-1"
        given:
          - "Запрос на создание новости содержит ссылку на обложку"
        when: "Новость создаётся"
        then:
          - "Сохранённая новость возвращает ту же ссылку на обложку"
        verification:
          - "automated"
        level: "integration"
      - id: "TS-2"
        given:
          - "Администратор авторизован в админке"
          - "Подготовлен файл изображения"
        when: "Создаётся новость с загруженной обложкой и открывается её публичная страница"
        then:
          - "На публичной странице отображается загруженная обложка"
        verification:
          - "automated"
        level: "e2e"

  - id: "US2"
    title: "Фото-галерея и видео в тексте новости"
    priority: "P1"
    description: >-
      Администратор одной операцией добавляет в текст новости галерею из нескольких фотографий и отдельным
      действием — видеоблок, задавая описание (alt) для каждого изображения на русском языке.
    motivation:
      problem: >-
        Редактор умеет только текст; фотографии и видео в новость может добавить лишь разработчик,
        а любая вставленная вручную разметка теряется при сохранении.
      value: >-
        Администратор публикует репортажные новости с фотоподборками и видео без участия разработчика.
      consequence_if_skipped: >-
        Новости от администратора остаются «простынёй текста» и заметно уступают программно созданным.
    why_priority: >-
      Это основное содержательное отличие админских новостей от эталонных.
    independent_test: >-
      Создать новость, добавить в неё галерею из трёх фото и один видеоблок, сохранить, открыть публичную
      страницу — видны все три фото в сетке и работающий видеоплеер.
    acceptance_scenarios:
      - id: "AS-4"
        given: "Администратор редактирует текст новости"
        when: "Он выбирает несколько изображений одной операцией вставки галереи"
        then: "Все выбранные изображения добавляются в текст одним блоком-галереей в порядке выбора"
      - id: "AS-5"
        given: "В тексте новости есть галерея"
        when: "Администратор задаёт описание (alt) для изображения"
        then: "Описание сохраняется вместе с изображением и присутствует на публичной странице"
      - id: "AS-6"
        given: "Администратор редактирует текст новости"
        when: "Он вставляет видеофайл"
        then: "В тексте появляется видеоблок с элементами управления воспроизведением"
      - id: "AS-7"
        given: "Новость с галереей и видео сохранена"
        when: "Администратор снова открывает её на редактирование"
        then: "Галерея и видеоблок отображаются в редакторе в том же виде и не исчезают при повторном сохранении"
    acceptance_criteria:
      - id: "AC-5"
        description: "Вставка галереи принимает несколько файлов за одну операцию и показывает прогресс/результат загрузки"
        done: false
      - id: "AC-6"
        description: "Каждому изображению галереи можно задать русскоязычное описание (alt)"
        done: false
      - id: "AC-7"
        description: "Вставка видео создаёт в тексте воспроизводимый видеоблок"
        done: false
      - id: "AC-8"
        description: "Повторное открытие и сохранение новости сохраняет галереи и видео без потерь"
        done: false
      - id: "AC-9"
        description: "Файл размером больше допустимого лимита отклоняется с понятным сообщением, остальные файлы выборки загружаются"
        done: false
    test_scenarios:
      - id: "TS-3"
        given:
          - "Содержимое новости с блоком галереи и видеоблоком"
        when: "Содержимое сериализуется редактором и разбирается обратно"
        then:
          - "Число изображений, их ссылки и описания совпадают с исходными"
          - "Видеоблок сохраняет ссылку на файл и тип содержимого"
        verification:
          - "automated"
        level: "unit"
      - id: "TS-4"
        given:
          - "Администратор авторизован в админке"
          - "Подготовлены три изображения и один видеофайл"
        when: "Создаётся новость с галереей из трёх фото и видео, затем открывается публичная страница"
        then:
          - "На публичной странице три изображения в сетке и один видеоплеер"
        verification:
          - "automated"
        level: "e2e"

  - id: "US3"
    title: "Публикационные атрибуты: теги, адрес, SEO-описание, статус"
    priority: "P2"
    description: >-
      Администратор управляет тегами новости, её адресом (slug), SEO-заголовком и SEO-описанием,
      а также решает, опубликована новость или скрыта.
    motivation:
      problem: >-
        Теги, адрес, SEO-поля и статус публикации задаются только программно; админ не может ни
        проставить теги, ни сохранить черновик.
      value: >-
        Новости от администратора попадают в теговые подборки, получают осмысленный адрес и корректные
        SEO-описания, а незаконченную новость можно не публиковать сразу.
      consequence_if_skipped: >-
        Новости админа выпадают из теговой навигации и поисковой выдачи, черновики невозможны.
    why_priority: >-
      Важно для паритета и SEO, но новость остаётся публикуемой и без этого — поэтому после US1/US2.
    independent_test: >-
      Создать новость с двумя тегами, своим адресом и SEO-описанием в статусе «не опубликована» —
      она не видна в публичном списке; после включения публикации появляется с указанными тегами.
    acceptance_scenarios:
      - id: "AS-8"
        given: "Администратор заполняет заголовок новой новости"
        then: "Адрес новости предлагается автоматически и остаётся доступным для ручной правки"
        when: "Он переходит к полю адреса"
      - id: "AS-9"
        given: "Администратор ввёл адрес с недопустимыми символами"
        when: "Он пытается сохранить новость"
        then: "Сохранение не происходит, показано понятное сообщение о допустимом формате адреса"
      - id: "AS-10"
        given: "Новость создана с выключенной публикацией"
        when: "Посетитель открывает публичный список новостей"
        then: "Эта новость в списке отсутствует"
      - id: "AS-11"
        given: "Открыта на редактирование новость с тегами и статусом «опубликована»"
        when: "Администратор меняет только текст и сохраняет"
        then: "Теги и статус публикации остаются прежними"
    acceptance_criteria:
      - id: "AC-10"
        description: "Теги можно добавлять и удалять по одному, они сохраняются вместе с новостью"
        done: false
      - id: "AC-11"
        description: "Адрес новости автоматически предлагается из заголовка и редактируется вручную"
        done: false
      - id: "AC-12"
        description: "Недопустимый адрес блокирует сохранение с понятным сообщением"
        done: false
      - id: "AC-13"
        description: "SEO-заголовок ограничен 160 символами, SEO-описание — 300, превышение показывается администратору"
        done: false
      - id: "AC-14"
        description: "Переключатель публикации управляет видимостью новости в публичном списке"
        done: false
    test_scenarios:
      - id: "TS-5"
        given:
          - "Заголовок новости на русском языке"
        when: "Формируется предлагаемый адрес"
        then:
          - "Адрес состоит только из строчных латинских букв, цифр и дефисов"
          - "Адрес не пустой и уникален среди существующих"
        verification:
          - "automated"
        level: "unit"
      - id: "TS-6"
        given:
          - "Новость сохранена с выключенной публикацией"
        when: "Запрашивается публичный список новостей"
        then:
          - "Новость в ответе отсутствует"
        verification:
          - "automated"
        level: "integration"

  - id: "US4"
    title: "Медиа новостей не засоряет публичную фотогалерею"
    priority: "P2"
    description: >-
      Фотографии и видео, загруженные для конкретной новости, не появляются в публичном разделе фотогалереи сайта.
    motivation:
      problem: >-
        Действующая загрузка медиа создаёт запись в публичной фотогалерее для каждого файла, поэтому
        иллюстрации из текста новости попадут в общую галерею как отдельные снимки.
      value: >-
        Фотогалерея сайта остаётся курируемой подборкой, а не свалкой служебных картинок из новостей.
      consequence_if_skipped: >-
        После первой же новости с галереей публичная фотогалерея засоряется, и админу придётся чистить её вручную.
    why_priority: >-
      Не блокирует публикацию новости, но без этого US2 создаёт видимый пользователям побочный эффект.
    independent_test: >-
      Загрузить три фото для новости, затем открыть публичную фотогалерею — новых снимков в ней нет.
    acceptance_scenarios:
      - id: "AS-12"
        given: "Публичная фотогалерея содержит N снимков"
        when: "Администратор загружает 3 фотографии в текст новости"
        then: "Публичная фотогалерея по-прежнему содержит N снимков"
      - id: "AS-13"
        given: "Администратор работает в разделе фотогалереи"
        when: "Он загружает фотографии там"
        then: "Эти фотографии по-прежнему появляются в публичной фотогалерее"
    acceptance_criteria:
      - id: "AC-15"
        description: "Загрузка медиа для новости не увеличивает число снимков в публичной фотогалерее"
        done: false
      - id: "AC-16"
        description: "Существующая загрузка снимков в разделе фотогалереи продолжает работать как раньше"
        done: false
      - id: "AC-17"
        description: "Видеофайл принимается загрузкой медиа новостей и получает корректный тип"
        done: false
    test_scenarios:
      - id: "TS-7"
        given:
          - "Известно текущее число снимков публичной фотогалереи"
        when: "Выполняется загрузка изображения для новости"
        then:
          - "Число снимков публичной фотогалереи не изменилось"
          - "Загруженный файл доступен по возвращённой ссылке"
        verification:
          - "automated"
        level: "integration"

edge_cases:
  - id: "EC-1"
    description: "Файл превышает допустимый лимит размера"
    expected_behavior: "Файл отклоняется с понятным сообщением, остальные файлы выборки загружаются, редактор остаётся рабочим"
  - id: "EC-2"
    description: "Загрузка файла прерывается из-за сетевой ошибки"
    expected_behavior: "Администратор видит сообщение об ошибке, набранный текст новости не теряется, загрузку можно повторить"
  - id: "EC-3"
    description: "Выбран файл неподдерживаемого типа (например, документ)"
    expected_behavior: "Файл не загружается, показано сообщение о допустимых типах"
  - id: "EC-4"
    description: "Администратор вручную задал адрес, уже занятый другой новостью"
    expected_behavior: "Сохранение не проходит, показано сообщение о занятом адресе"
  - id: "EC-5"
    description: "Сессия администратора истекла во время работы в редакторе"
    expected_behavior: "Администратор перенаправляется на вход, после успешного входа возвращается в раздел новостей"
  - id: "EC-6"
    description: "Новость сохраняется с пустым текстом"
    expected_behavior: "Сохранение блокируется с сообщением о том, что текст обязателен"
  - id: "EC-7"
    description: "Открыта на редактирование новость, созданная программно и содержащая галерею и видео"
    expected_behavior: "Редактор отображает её содержимое без потерь, повторное сохранение не портит разметку"

functional_requirements:
  - id: "FR-001"
    text: "Редактор новости MUST позволять загрузить обложку и показывать её превью до сохранения"
    story_refs:
      - "US1"
  - id: "FR-002"
    text: "Система MUST сохранять обложку, заданную при создании новости, а не только при редактировании"
    story_refs:
      - "US1"
  - id: "FR-003"
    text: "Редактор MUST позволять заменить и полностью удалить обложку существующей новости"
    story_refs:
      - "US1"
  - id: "FR-004"
    text: "WHEN администратор сохраняет новость, не изменяя обложку, THEN система MUST сохранить прежнюю обложку"
    story_refs:
      - "US1"
      - "US3"
  - id: "FR-005"
    text: "Редактор MUST позволять добавить в текст новости галерею из нескольких изображений за одну операцию выбора файлов"
    story_refs:
      - "US2"
  - id: "FR-006"
    text: "Редактор MUST позволять задать русскоязычное описание (alt) каждому изображению в тексте"
    story_refs:
      - "US2"
  - id: "FR-007"
    text: "Редактор MUST позволять вставить в текст видеоблок с элементами управления воспроизведением"
    story_refs:
      - "US2"
  - id: "FR-008"
    text: "Система MUST сохранять галереи и видеоблоки без потерь при сохранении и повторном открытии новости"
    story_refs:
      - "US2"
  - id: "FR-009"
    text: "Публичная страница новости MUST отображать галереи и видео, созданные в редакторе, так же, как у новостей, опубликованных программно"
    story_refs:
      - "US2"
  - id: "FR-010"
    text: "Редактор MUST позволять добавлять и удалять теги новости"
    story_refs:
      - "US3"
  - id: "FR-011"
    text: "Редактор MUST предлагать адрес новости автоматически по заголовку и допускать ручную правку"
    story_refs:
      - "US3"
  - id: "FR-012"
    text: "Система MUST отклонять сохранение новости с адресом, не соответствующим формату из строчных латинских букв, цифр и дефисов, с понятным сообщением"
    story_refs:
      - "US3"
  - id: "FR-013"
    text: "Редактор MUST позволять задать SEO-заголовок (не более 160 символов) и SEO-описание (не более 300 символов) и показывать превышение лимита"
    story_refs:
      - "US3"
  - id: "FR-014"
    text: "Редактор MUST позволять переключать статус публикации новости, и неопубликованная новость MUST отсутствовать в публичном списке"
    story_refs:
      - "US3"
  - id: "FR-015"
    text: "WHEN администратор сохраняет новость, не изменяя теги и статус публикации, THEN система MUST сохранить их прежние значения"
    story_refs:
      - "US3"
  - id: "FR-016"
    text: "Загрузка медиа для новости MUST NOT добавлять снимки в публичную фотогалерею сайта"
    story_refs:
      - "US4"
  - id: "FR-017"
    text: "Загрузка медиа для новости MUST принимать видеофайлы и сохранять корректный тип содержимого"
    story_refs:
      - "US4"
  - id: "FR-018"
    text: "WHEN загружаемый файл превышает допустимый лимит размера или имеет неподдерживаемый тип, THEN система MUST отклонить его с понятным сообщением, не прерывая загрузку остальных выбранных файлов"
    story_refs:
      - "US2"
      - "US4"
  - id: "FR-019"
    text: "Существующая загрузка снимков в разделе фотогалереи MUST продолжать работать без изменений в поведении"
    story_refs:
      - "US4"
  - id: "FR-020"
    text: "Редактор MUST открывать новости, созданные программно, без потери их галерей и видео"
    story_refs:
      - "US2"

key_entities:
  - id: "E-1"
    name: "Новость"
    description: >-
      Публикация школы: заголовок, краткое описание, текст с иллюстрациями и видео, обложка, теги,
      адрес, SEO-заголовок, SEO-описание, статус публикации и дата публикации.
  - id: "E-2"
    name: "Медиафайл новости"
    description: >-
      Изображение или видео, загруженное администратором для конкретной новости; хранится во внешнем
      хранилище и доступно по публичной ссылке, в публичную фотогалерею не попадает.
  - id: "E-3"
    name: "Блок галереи"
    description: >-
      Элемент текста новости, объединяющий несколько изображений с описаниями в единую сетку.
  - id: "E-4"
    name: "Видеоблок"
    description: >-
      Элемент текста новости, содержащий ссылку на видеофайл и отображаемый как плеер с элементами управления.

success_criteria:
  - id: "SC-001"
    description: >-
      Администратор без помощи разработчика публикует новость с обложкой, галереей из трёх фото, видео
      и тегами, и её публичная страница по составу элементов не отличается от новостей, опубликованных ранее программно.
    measurable_via: "Сквозной сценарий в админке с последующим сравнением состава элементов публичной страницы с эталонной новостью"
  - id: "SC-002"
    description: "Полный цикл публикации такой новости занимает не более 10 минут работы администратора"
    measurable_via: "Замер времени прохождения сценария администратором"
  - id: "SC-003"
    description: "Ни одна новость не теряет обложку, теги, статус публикации, галереи или видео при повторном редактировании"
    measurable_via: "Проверка состава полей и элементов до и после цикла «открыть — сохранить» для новости каждого типа"
  - id: "SC-004"
    description: "После публикации 5 новостей с иллюстрациями число снимков в публичной фотогалерее не изменяется"
    measurable_via: "Сравнение числа снимков публичной фотогалереи до и после серии публикаций"
  - id: "SC-005"
    description: "Все ошибки загрузки и валидации сопровождаются понятным русскоязычным сообщением и не приводят к потере набранного текста"
    measurable_via: "Проверка сценариев из раздела крайних случаев"

assumptions:
  - id: "A-1"
    description: >-
      Паритет качества оценивается по составу и оформлению элементов страницы (обложка, абзацы с
      выделениями, сетка фотографий, видеоплеер, теги), а не по побайтовому совпадению разметки.
  - id: "A-2"
    description: >-
      Действующий лимит размера файла в 20 МБ сохраняется и для изображений, и для видео; отдельная
      серверная перекодировка видео в рамках этой задачи не выполняется.
  - id: "A-3"
    description: >-
      Поддерживаемые типы: распространённые форматы изображений (JPEG, PNG, WebP) и видео в формате MP4.
  - id: "A-4"
    description: >-
      Англоязычные поля новости (заголовок, описание, текст) остаются вне интерфейса редактора и
      сохраняют прежние значения — сайт ведётся на русском языке.
  - id: "A-5"
    description: >-
      Удаление медиафайла из текста новости не влечёт немедленного удаления файла из хранилища.
  - id: "A-6"
    description: >-
      Редактор остаётся одностраничной формой внутри раздела «Новости и события»; отдельный раздел
      медиабиблиотеки не создаётся.
