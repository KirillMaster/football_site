feature: "Дублирование входящей обратной связи в Telegram и на email"
branch: "master"
created: "2026-09-13"
status: "Draft"
input: "Дублирование всей входящей обратной связи сайта (контактные сообщения POST /api/contact и заявки на пробную тренировку POST /api/tryout, а также будущие типы заявок) в два канала уведомлений: Telegram-бот @fc_arsenal_92_bot (env TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID) и email на ars2011sev@mail.ru через SMTP (env SMTP_HOST/SMTP_PORT/SMTP_USER/SMTP_PASSWORD, по умолчанию smtp.mail.ru:465 SSL). Отправка после успешного сохранения в БД, fire-and-forget, сбой уведомления не ломает приём заявки; несконфигурированный канал пропускается с warning. Текст: тип заявки, заполненные поля, дата/время Europe/Moscow, UTM. Интеграция в единой точке в Application-слое, реализации каналов в Infrastructure. Секреты только через env/GitHub Secrets."

user_stories:
  - id: "US1"
    title: "Администратор мгновенно узнаёт о новой заявке в Telegram"
    priority: "P1"
    description: "Когда посетитель отправляет контактное сообщение или заявку на пробную тренировку, администратор клуба получает сообщение в Telegram со всеми данными заявки, не заходя в админку."
    motivation:
      problem: "Заявки видны только в админке; администратор узнаёт о них с задержкой в часы или дни, лиды остывают."
      value: "Мгновенная реакция на лида: звонок родителю в течение минут, рост конверсии в запись."
      consequence_if_skipped: "Потеря лидов из-за медленной реакции; обратную связь приходится вручную мониторить в админке."
    why_priority: "Скорость реакции на лида — прямая ценность для бизнеса детской школы."
    independent_test: "Отправить заявку через сайт и убедиться, что в Telegram-чат администратора пришло сообщение со всеми полями заявки."
    acceptance_scenarios:
      - id: "AS-1"
        given: "Канал Telegram сконфигурирован (токен и chat_id заданы)"
        when: "Посетитель успешно отправляет контактное сообщение через форму сайта"
        then: "В Telegram-чат администратора приходит сообщение с типом заявки, всеми заполненными полями, датой/временем (Europe/Moscow) и UTM-метками, если они есть"
      - id: "AS-2"
        given: "Канал Telegram сконфигурирован"
        when: "Посетитель успешно отправляет заявку на пробную тренировку"
        then: "В Telegram приходит сообщение с данными заявки (имя ребёнка, возраст, родитель, телефон и остальные заполненные поля)"
    acceptance_criteria:
      - id: "AC-1"
        description: "Уведомление в Telegram отправляется для каждого типа входящей обратной связи (контактное сообщение, заявка на пробную тренировку) после успешного сохранения в БД"
        done: false
      - id: "AC-2"
        description: "Текст уведомления содержит тип заявки, все непустые поля, дату/время по Europe/Moscow и UTM-метки при наличии"
        done: false
    test_scenarios:
      - id: "TS-1"
        given:
          - "Telegram-канал уведомлений сконфигурирован"
          - "Транспорт Telegram замокан"
        when: "Обрабатывается команда создания контактного сообщения"
        then:
          - "После сохранения заявки вызывается отправка Telegram-сообщения с корректно отформатированным текстом"
        verification:
          - "automated"
        level: "unit"
      - id: "TS-2"
        given:
          - "Приложение запущено с тестовой конфигурацией Telegram"
        when: "HTTP POST /api/contact с валидным телом"
        then:
          - "Ответ успешный; в перехваченный транспорт Telegram ушло одно сообщение с данными заявки"
        verification:
          - "automated"
        level: "integration"

  - id: "US2"
    title: "Дубль заявки приходит на почту клуба"
    priority: "P2"
    description: "Каждая входящая заявка дублируется письмом на почтовый ящик клуба krystyk@list.ru (env FEEDBACK_EMAIL_TO; изменение владельца от 13.09.2026, отправитель — SMTP-аккаунт ars2011sev@mail.ru), создавая независимый от Telegram архив обращений."
    motivation:
      problem: "Telegram — единственный оперативный канал; при его недоступности или потере телефона заявки нигде не дублируются."
      value: "Почта служит резервным каналом и архивом всех обращений."
      consequence_if_skipped: "Единая точка отказа в оповещениях; нет независимого архива заявок вне БД."
    why_priority: "Резервный канал важен, но основную оперативную ценность даёт Telegram."
    independent_test: "Отправить заявку через сайт и убедиться, что на krystyk@list.ru (FEEDBACK_EMAIL_TO) пришло письмо с данными заявки."
    acceptance_scenarios:
      - id: "AS-3"
        given: "Email-канал сконфигурирован (SMTP-параметры заданы)"
        when: "Посетитель успешно отправляет любую заявку через сайт"
        then: "На адрес клуба приходит письмо с типом заявки в теме и всеми заполненными полями в теле"
    acceptance_criteria:
      - id: "AC-3"
        description: "Письмо с данными заявки отправляется на настроенный адрес клуба для каждого типа входящей обратной связи"
        done: false
    test_scenarios:
      - id: "TS-3"
        given:
          - "Email-канал сконфигурирован"
          - "SMTP-транспорт замокан"
        when: "Обрабатывается команда создания заявки на пробную тренировку"
        then:
          - "После сохранения формируется и отправляется письмо: тема содержит тип заявки, тело — все непустые поля"
        verification:
          - "automated"
        level: "unit"

  - id: "US3"
    title: "Приём заявки не зависит от работоспособности уведомлений"
    priority: "P1"
    description: "Посетитель всегда получает подтверждение отправки, если заявка сохранена, независимо от сбоев Telegram или почты; несконфигурированные каналы пропускаются."
    motivation:
      problem: "Наивная интеграция уведомлений может уронить приём заявок при недоступности Telegram/SMTP."
      value: "Гарантия: ни одна заявка не потеряна и не отклонена из-за вторичной функциональности."
      consequence_if_skipped: "Сбой внешнего сервиса уведомлений блокирует главный бизнес-поток — приём лидов."
    why_priority: "Надёжность основного потока приёма заявок критичнее самих уведомлений."
    independent_test: "Сымитировать сбой обоих каналов и убедиться, что заявка сохранена и посетитель получил успешный ответ, а ошибки зафиксированы в логе."
    acceptance_scenarios:
      - id: "AS-4"
        given: "Оба канала уведомлений сконфигурированы, но внешние сервисы недоступны"
        when: "Посетитель отправляет заявку"
        then: "Заявка сохранена, посетитель видит успешный ответ, ошибки отправки записаны в лог"
      - id: "AS-5"
        given: "Ни один канал уведомлений не сконфигурирован (пустые переменные окружения)"
        when: "Посетитель отправляет заявку"
        then: "Заявка сохранена, посетитель видит успешный ответ, в лог записано предупреждение о пропуске каналов"
    acceptance_criteria:
      - id: "AC-4"
        description: "Сбой любого канала уведомлений не влияет на результат сохранения заявки и ответ посетителю"
        done: false
      - id: "AC-5"
        description: "Несконфигурированный канал пропускается без ошибки, с предупреждением в логе"
        done: false
      - id: "AC-6"
        description: "Ответ посетителю не ожидает завершения отправки уведомлений (fire-and-forget)"
        done: false
    test_scenarios:
      - id: "TS-4"
        given:
          - "Оба канала сконфигурированы"
          - "Моки каналов выбрасывают исключение при отправке"
        when: "Обрабатывается команда создания заявки"
        then:
          - "Команда завершается успешно, заявка сохранена"
          - "Исключения каналов залогированы и не всплывают наружу"
        verification:
          - "automated"
        level: "unit"
      - id: "TS-5"
        given:
          - "Переменные окружения каналов пусты"
        when: "HTTP POST /api/contact с валидным телом"
        then:
          - "Ответ успешный, заявка в БД, в логе предупреждение о несконфигурированных каналах"
        verification:
          - "automated"
        level: "integration"

edge_cases:
  - id: "EC-1"
    description: "Сконфигурирован только один канал из двух"
    expected_behavior: "Сконфигурированный канал отправляет уведомление, второй пропускается с предупреждением в логе"
  - id: "EC-2"
    description: "В заявке заполнены не все поля (нет email, нет UTM)"
    expected_behavior: "Пустые поля не включаются в текст уведомления; сообщение остаётся читабельным"
  - id: "EC-3"
    description: "Поля заявки содержат символы, специальные для формата канала (разметка Telegram, HTML)"
    expected_behavior: "Текст экранируется/передаётся безопасно; уведомление доставляется без искажения данных и без инъекции разметки"
  - id: "EC-4"
    description: "Внешний сервис канала отвечает медленно (таймаут)"
    expected_behavior: "Отправка ограничена таймаутом, ошибка логируется, ответ посетителю не задерживается"

functional_requirements:
  - id: "FR-001"
    text: "Система MUST отправлять уведомление в Telegram-чат администратора после успешного сохранения каждой входящей заявки (контактное сообщение, заявка на пробную тренировку), когда Telegram-канал сконфигурирован"
    story_refs:
      - "US1"
  - id: "FR-002"
    text: "Система MUST отправлять письмо с данными заявки на настроенный почтовый адрес клуба после успешного сохранения каждой входящей заявки, когда email-канал сконфигурирован"
    story_refs:
      - "US2"
  - id: "FR-003"
    text: "Уведомление MUST содержать тип заявки, все непустые поля заявки, дату/время создания в часовом поясе Europe/Moscow и UTM-метки при их наличии"
    story_refs:
      - "US1"
      - "US2"
  - id: "FR-004"
    text: "WHEN отправка уведомления по любому каналу завершается ошибкой, THEN система MUST зафиксировать ошибку в логе и MUST NOT влиять на сохранение заявки и ответ посетителю"
    story_refs:
      - "US3"
  - id: "FR-005"
    text: "WHEN канал уведомлений не сконфигурирован (пустые параметры), THEN система MUST пропустить канал и записать предупреждение в лог"
    story_refs:
      - "US3"
  - id: "FR-006"
    text: "Система MUST выполнять отправку уведомлений асинхронно (fire-and-forget), не задерживая ответ посетителю"
    story_refs:
      - "US3"
  - id: "FR-007"
    text: "Параметры каналов (токен бота, chat_id, SMTP-реквизиты, адрес получателя) MUST задаваться только через переменные окружения/секреты и MUST NOT попадать в исходный код и репозиторий"
    story_refs:
      - "US1"
      - "US2"
  - id: "FR-008"
    text: "Точка интеграции уведомлений MUST быть единой и расширяемой: добавление нового типа заявки или нового канала не требует изменения существующих обработчиков других типов"
    story_refs:
      - "US1"
      - "US2"

key_entities:
  - id: "E-1"
    name: "FeedbackNotification"
    description: "Представление входящей заявки для уведомления: тип заявки, набор непустых полей, момент создания, UTM-метки"
  - id: "E-2"
    name: "NotificationChannel"
    description: "Канал доставки уведомления (Telegram, Email) с собственной конфигурацией и правилом «пропустить, если не сконфигурирован»"

success_criteria:
  - id: "SC-001"
    description: "100% успешно сохранённых заявок порождают уведомление в каждом сконфигурированном канале"
    measurable_via: "Интеграционные тесты; сверка количества заявок в БД с количеством уведомлений в перехваченных транспортах"
  - id: "SC-002"
    description: "Администратор получает уведомление о новой заявке не позднее чем через 1 минуту после её отправки посетителем"
    measurable_via: "Ручная проверка на проде: отправка тестовой заявки и замер времени доставки в Telegram/на почту"
  - id: "SC-003"
    description: "При полном отказе внешних сервисов уведомлений доля успешно принятых заявок не снижается"
    measurable_via: "Автотест: моки каналов бросают исключения, приём заявок остаётся успешным"

assumptions:
  - id: "A-1"
    description: "Получатель Telegram — один чат (личный чат администратора с ботом либо группа); chat_id задаётся конфигурацией после того, как администратор напишет боту /start"
  - id: "A-2"
    description: "Отправка почты идёт через SMTP-аккаунт ящика клуба (пароль приложения mail.ru); до предоставления пароля канал остаётся несконфигурированным и пропускается"
  - id: "A-3"
    description: "Существующие типы заявок — контактное сообщение и заявка на пробную тренировку; спонсорство и стажировки сейчас приходят через ту же контактную форму и отдельных типов не требуют"
  - id: "A-4"
    description: "Гарантированная доставка (retry-очередь) не требуется: при сбое канала достаточно записи в лог, так как заявка всегда доступна в админке"
