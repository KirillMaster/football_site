feature: "Надёжная сессия админки (обновление токена и корректный выход)"
branch: "master"
created: "2026-09-13"
status: "Draft"
input: "Надёжная сессия админки сайта. Проблема: после истечения access-токена (15 мин) страницы /admin показывают пустые данные («0 тренеров, 0 новостей») без объяснения — admin-запросы получают 401 и молча возвращают пустоту; refresh-токен (выдаётся бэкендом POST /api/admin/auth/login вместе с accessToken, обновление через POST /api/admin/auth/refresh, срок 7 дней) на фронте не сохраняется и не используется. Требуется: (1) при логине сохранять пару access+refresh; (2) единая обёртка admin-запросов: при 401 — одна попытка refresh (single-flight, конкурентные запросы ждут одну операцию) и повтор исходного запроса; при неудаче refresh — очистка сессии и редирект на /admin/login с сохранением исходного пути для возврата после входа; (3) выход: очистка обоих токенов и редирект на логин (кнопка «Выйти» уже есть в AdminLayout); (4) страницы админки никогда не показывают молча пустые данные из-за протухшей сессии — либо валидные данные, либо редирект на логин. Backend НЕ меняется (эндпоинты login/refresh уже есть). Frontend Next.js 15: src/frontend/src/lib/api.ts (authHeaders + admin-функции), src/frontend/src/components/AdminLayout.tsx, src/frontend/src/app/admin/login/page.tsx. Хранение токенов: localStorage (как сейчас). Тесты: unit на обёртку (401→refresh→retry, refresh-fail→redirect, single-flight)."

user_stories:
  - id: "US1"
    title: "Прозрачное продление сессии администратора"
    priority: "P1"
    description: "Администратор работает в панели управления дольше 15 минут (срок действия сессионного ключа) и продолжает видеть актуальные данные всех разделов без повторного входа — сессия продлевается автоматически и незаметно."
    motivation:
      problem: "Через 15 минут после входа разделы админки молча показывают пустые данные («0 тренеров, 0 новостей») — запросы отклоняются как неавторизованные, а ключ продления, который выдаётся при входе, нигде не сохраняется и не используется."
      value: "Администратор работает непрерывно до 7 дней (срок ключа продления) без повторных входов и без ложных «пустых» экранов."
      consequence_if_skipped: "Владелец продолжает регулярно видеть «пустую» админку, считает её сломанной и не может нормально управлять контентом."
    why_priority: "Это корневая причина заявленной проблемы «0 тренеров, 0 новостей»; без неё остальные улучшения не устраняют боль."
    independent_test: "Войти в админку, дождаться истечения сессионного ключа (или искусственно подменить его на просроченный), открыть раздел «Тренеры»: данные отображаются корректно, повторный вход не требуется."
    acceptance_scenarios:
      - id: "AS-1"
        given: "Администратор вошёл в админку, сессионный ключ истёк, ключ продления действителен"
        when: "Администратор открывает любой раздел админки (например, «Тренеры»)"
        then: "Сессия продлевается автоматически, раздел показывает актуальные данные, администратор не замечает перебоя"
      - id: "AS-2"
        given: "Сессионный ключ истёк, ключ продления действителен"
        when: "Страница раздела выполняет несколько запросов данных одновременно"
        then: "Продление сессии выполняется ровно один раз, все запросы завершаются успешно с новыми учётными данными"
    acceptance_criteria:
      - id: "AC-1"
        description: "При входе сохраняются оба ключа: сессионный и ключ продления"
        done: false
      - id: "AC-2"
        description: "Отклонённый как неавторизованный запрос данных админки автоматически вызывает одну попытку продления сессии и повторяется с новым ключом"
        done: false
      - id: "AC-3"
        description: "При конкурентных запросах продление выполняется однократно (single-flight), остальные запросы ждут его результата"
        done: false
    test_scenarios:
      - id: "TS-1"
        given:
          - "Сохранена пара ключей, сессионный ключ просрочен"
        when: "Запрос данных админки получает отказ «не авторизован»"
        then:
          - "Выполняется одна попытка продления"
          - "Исходный запрос повторяется с новым ключом и возвращает данные"
        verification:
          - "automated"
        level: "unit"
      - id: "TS-2"
        given:
          - "Сессионный ключ просрочен"
        when: "Три запроса данных стартуют одновременно и получают отказ «не авторизован»"
        then:
          - "Операция продления выполняется ровно один раз"
          - "Все три запроса завершаются успешно"
        verification:
          - "automated"
        level: "unit"

  - id: "US2"
    title: "Честное завершение сессии вместо пустых экранов"
    priority: "P2"
    description: "Когда сессию невозможно продлить (ключ продления истёк или отозван), администратор сразу попадает на форму входа, а после повторного входа возвращается на страницу, с которой его выбросило."
    motivation:
      problem: "Сейчас невалидная сессия выглядит как «пустая админка» без каких-либо объяснений — администратор не понимает, что нужно просто войти заново."
      value: "Администратор всегда однозначно понимает состояние: либо он видит данные, либо форму входа; после входа он продолжает с того же места."
      consequence_if_skipped: "«Пустая админка» останется для случая полностью истёкшей сессии (после 7 дней), проблема будет всплывать реже, но так же непонятно."
    why_priority: "Зависит от механизма US1 (обработка отказа авторизации); встречается реже — только при полностью истёкшей сессии."
    independent_test: "Подменить оба ключа на невалидные, открыть раздел админки: происходит перенаправление на форму входа; после успешного входа администратор возвращается в тот же раздел."
    acceptance_scenarios:
      - id: "AS-3"
        given: "Сессионный ключ истёк, ключ продления невалиден или истёк"
        when: "Администратор открывает раздел админки"
        then: "Сессия очищается, администратор перенаправляется на форму входа; пустые данные не показываются"
      - id: "AS-4"
        given: "Администратор был перенаправлён на форму входа из раздела «Новости»"
        when: "Администратор успешно входит"
        then: "Администратор попадает обратно в раздел «Новости»"
      - id: "AS-5"
        given: "Администратор работает в админке"
        when: "Администратор нажимает «Выйти»"
        then: "Оба ключа удаляются, администратор попадает на форму входа; возврат кнопкой «назад» не показывает данные под старой сессией"
    acceptance_criteria:
      - id: "AC-4"
        description: "Неудачное продление сессии очищает оба ключа и перенаправляет на форму входа с запоминанием исходного пути"
        done: false
      - id: "AC-5"
        description: "После успешного входа администратор возвращается на сохранённый исходный путь (по умолчанию — обзорная страница)"
        done: false
      - id: "AC-6"
        description: "Выход удаляет оба ключа и ведёт на форму входа"
        done: false
    test_scenarios:
      - id: "TS-3"
        given:
          - "Оба ключа невалидны"
        when: "Запрос данных админки получает отказ, попытка продления тоже отклонена"
        then:
          - "Оба ключа удалены из хранилища"
          - "Выполняется перенаправление на форму входа с параметром исходного пути"
        verification:
          - "automated"
        level: "unit"
      - id: "TS-4"
        given:
          - "Форма входа открыта с сохранённым исходным путём раздела"
        when: "Администратор успешно входит"
        then:
          - "Выполняется переход на сохранённый исходный путь"
        verification:
          - "automated"
        level: "unit"

edge_cases:
  - id: "EC-1"
    description: "Повторный запрос после успешного продления снова отклонён как неавторизованный"
    expected_behavior: "Вторая попытка продления для того же запроса не выполняется; сессия очищается, администратор перенаправляется на форму входа (защита от бесконечного цикла)."
  - id: "EC-2"
    description: "Продление завершилось сетевой ошибкой (сервер недоступен), а не отказом в авторизации"
    expected_behavior: "Сессия не очищается; исходный запрос завершается ошибкой, раздел показывает состояние ошибки/пустые данные без выхода из сессии — при восстановлении сети следующая попытка снова попробует продление."
  - id: "EC-3"
    description: "Сохранённый исходный путь указывает за пределы админки (подделан вручную)"
    expected_behavior: "Возврат выполняется только на пути внутри админки; иначе — на обзорную страницу админки."
  - id: "EC-4"
    description: "Продление происходит в одной из нескольких открытых вкладок админки"
    expected_behavior: "Обновлённая пара ключей сохраняется в общем хранилище; остальные вкладки продолжают работать с новой парой при следующих запросах."

functional_requirements:
  - id: "FR-001"
    text: "Система MUST сохранять при входе администратора оба выданных ключа — сессионный и ключ продления."
    story_refs:
      - "US1"
  - id: "FR-002"
    text: "WHEN запрос данных админки отклонён как неавторизованный, система MUST выполнить одну попытку продления сессии и повторить исходный запрос с новым сессионным ключом."
    story_refs:
      - "US1"
  - id: "FR-003"
    text: "Система MUST выполнять продление сессии однократно при любом числе одновременных отклонённых запросов (single-flight); остальные запросы ждут результата этой операции."
    story_refs:
      - "US1"
  - id: "FR-004"
    text: "WHEN продление сессии отклонено сервером, система MUST удалить оба ключа и перенаправить администратора на форму входа, сохранив исходный путь для возврата."
    story_refs:
      - "US2"
  - id: "FR-005"
    text: "WHEN администратор успешно входит после перенаправления, система MUST вернуть его на сохранённый исходный путь внутри админки; недопустимые пути заменяются обзорной страницей."
    story_refs:
      - "US2"
  - id: "FR-006"
    text: "WHEN администратор нажимает «Выйти», система MUST удалить оба ключа и перенаправить на форму входа."
    story_refs:
      - "US2"
  - id: "FR-007"
    text: "Система MUST NOT показывать разделы админки с пустыми данными из-за невалидной сессии: итог любого запроса — либо данные под валидной сессией, либо перенаправление на форму входа."
    story_refs:
      - "US1"
      - "US2"
  - id: "FR-008"
    text: "WHEN продление сессии не удалось из-за сетевой ошибки (не отказа в авторизации), система MUST сохранить текущую сессию и не выполнять перенаправление на форму входа."
    story_refs:
      - "US2"
  - id: "FR-009"
    text: "Серверная часть системы MUST остаться без изменений: используются существующие операции входа и продления сессии."
    story_refs:
      - "US1"
      - "US2"

key_entities:
  - id: "E-1"
    name: "Сессия администратора"
    description: "Пара ключей в локальном хранилище браузера: короткоживущий сессионный ключ (15 минут) и ключ продления (7 дней), выдаваемые при входе и обновляемые при продлении."
  - id: "E-2"
    name: "Исходный путь возврата"
    description: "Путь раздела админки, с которого администратора перенаправили на форму входа; используется для возврата после успешного входа."

success_criteria:
  - id: "SC-001"
    description: "Администратор, работающий в админке дольше 15 минут, продолжает видеть актуальные данные разделов без повторного входа."
    measurable_via: "Ручная проверка: вход, пауза >15 минут (или подмена сессионного ключа на просроченный), открытие раздела «Тренеры» — данные видны."
  - id: "SC-002"
    description: "Случай «раздел админки молча показывает нули из-за истёкшей сессии» не воспроизводится ни при каком состоянии ключей."
    measurable_via: "Проверка матрицы состояний ключей (валидны/просрочен сессионный/просрочены оба): всегда либо данные, либо форма входа."
  - id: "SC-003"
    description: "После вынужденного повторного входа администратор возвращается на страницу, с которой начал, в 100% случаев для путей внутри админки."
    measurable_via: "Автотесты формы входа + ручная проверка с двух разных разделов."
  - id: "SC-004"
    description: "Все автоматические проверки поведения обёртки запросов (продление, повтор, single-flight, очистка сессии) проходят."
    measurable_via: "Прогон unit-тестов фронтенда в CI."

assumptions:
  - id: "A-1"
    description: "Ключи хранятся в локальном хранилище браузера (как сейчас); переход на httpOnly-cookie вне рамок этой фичи."
  - id: "A-2"
    description: "Серверные операции входа и продления уже работают корректно (сессионный ключ 15 минут, ключ продления 7 дней) и не меняются."
  - id: "A-3"
    description: "Отзыв ключа продления на сервере при выходе не требуется — выход выполняется на стороне браузера удалением ключей."
  - id: "A-4"
    description: "Публичная часть сайта не затрагивается: изменения касаются только запросов разделов админки."
