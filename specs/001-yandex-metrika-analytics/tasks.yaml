  # ───────────────────────── Phase 5 · US4 (P2, вспомогательные точки) ─────────────────────────
  - id: "T011"
    title: "Компонент PhoneLink и замена tel:-ссылок"
    description: "Создать <PhoneLink place> с событием phone_click и заменить прямые tel:-ссылки в Footer/kontakty/zapisatsya/stazhirovki."
