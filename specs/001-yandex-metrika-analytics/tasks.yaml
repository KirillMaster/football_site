      - order: 2
        action: "Подтвердить условный рендер"
        detail: "Компонент рендерится/инициализируется только при непустом NEXT_PUBLIC_YM_ID (strategy afterInteractive)."
    technical_notes:
      - path: "src/frontend/src/components/Analytics.tsx"
        note: "next/script afterInteractive; карта скроллинга и аналитика форм включаются в кабинете (A-5)."
