feature: "Яндекс.Метрика и сквозная веб-аналитика воронки заявок fcarsenal92.ru"
tasks:
  # ───────────────────────── Phase 1 · Setup (клиентский слой аналитики) ─────────────────────────
  - id: "T001"
    title: "Создать обёртку reachGoal (lib/analytics.ts)"
    description: "Единая безопасная точка отправки целей в Яндекс.Метрику с guard'ом на отсутствие счётчика и хелперами под 7 согласованных целей."
    context: "Нужна одна точка, чтобы имена целей не расходились и сайт не падал при заблокированном счётчике."
    story_ref: "US1"
    requirement_refs: ["FR-004", "FR-018", "FR-019"]
    depends_on: []
    parallelizable: true
    entity_refs: ["analytics_goal"]
    contract_refs: ["reach_goal"]
    steps:
      - order: 1
        action: "Создать файл lib/analytics.ts"
        detail: "src/frontend/src/lib/analytics.ts — экспортировать reachGoal(name, params?) и getYmClientId(cb)."
      - order: 2
        action: "Реализовать guard"
        detail: "Проверять наличие window.ym и NEXT_PUBLIC_YM_ID; при отсутствии — молча выходить (contract reach_goal → counter_unavailable), не бросать исключений."
      - order: 3
        action: "Добавить типизированные имена целей"
        detail: "Литеральный union из enum analytics_goal.name: trial_form_submit, trial_form_open, phone_click, map_click, other_lead_submit, sponsor_click, sponsor_form_submit."
      - order: 4
        action: "Реализовать getYmClientId"
        detail: "window.ym(YM_ID,'getClientID',cb) с fallback на пустую строку, если счётчик не готов (EC-4)."
    technical_notes:
      - path: "src/frontend/src/components/Analytics.tsx"
        note: "Источник YM_ID из NEXT_PUBLIC_YM_ID — переиспользовать ту же переменную окружения."
    acceptance_criteria:
      - id: "AC-1"
        description: "reachGoal вызывает window.ym только при наличии счётчика; при его отсутствии — no-op без ошибок."
        done: false
      - id: "AC-2"
        description: "Экспортированы имена всех 7 целей, совпадающие с enum analytics_goal.name."
        done: false
    test_scenarios:
      - id: "TS-1"
        given: ["window.ym не определён (счётчик заблокирован)"]
        when: "Вызвана reachGoal('phone_click', {place:'footer'})"
        then: ["Исключение не выброшено", "Никаких сетевых вызовов не произведено"]
        verification: ["automated"]
        level: "unit"

  - id: "T002"
    title: "Захват UTM первого касания (lib/utm.ts)"
    description: "Считывать utm_* из адреса при первом визите, хранить в cookie (~90 дней, first-touch) и отдавать getStoredUtm() для payload заявок."
    context: "Без сохранённого источника невозможно связать рекламу с заявкой; first-touch не должен перетираться."
    story_ref: "US3"
    requirement_refs: ["FR-011", "FR-012", "FR-017"]
    depends_on: []
    parallelizable: true
    entity_refs: ["utm_first_touch"]
    contract_refs: ["get_utm_first_touch"]
    steps:
      - order: 1
        action: "Создать файл lib/utm.ts"
        detail: "src/frontend/src/lib/utm.ts — экспортировать captureUtmFirstTouch() и getStoredUtm()."
      - order: 2
        action: "Реализовать first-touch запись"
        detail: "При наличии utm_* в location.search и отсутствии cookie записать cookie 'utm_ft' (JSON: utmSource/Medium/Campaign/Content/Term + capturedAt), max-age ~90 дней, path=/, SameSite=Lax."
      - order: 3
        action: "Реализовать чтение"
        detail: "getStoredUtm() парсит cookie → объект UTM (contract get_utm_first_touch → found); при отсутствии → пустой объект (→ empty, EC-3)."
      - order: 4
        action: "Вызвать захват при загрузке"
        detail: "Вызвать captureUtmFirstTouch() из клиентского слоя (например, в Analytics.tsx useEffect или отдельном client-компоненте в layout)."
    technical_notes:
      - path: "src/frontend/src/app/layout.tsx"
        note: "Место монтирования клиентского захвата на всех страницах."
    acceptance_criteria:
      - id: "AC-1"
        description: "Первый визит с utm_* создаёт cookie; повторный визит с другими метками cookie не перезаписывает (FR-012)."
        done: false
      - id: "AC-2"
        description: "getStoredUtm() возвращает пустой объект при прямом заходе без ошибок."
        done: false
    test_scenarios:
      - id: "TS-1"
        given: ["Cookie utm_ft уже установлен со source=A"]
        when: "Визит с ?utm_source=B и повторный getStoredUtm()"
        then: ["Возвращается source=A (первое касание сохранено)"]
        verification: ["automated"]
        level: "unit"

  # ───────────────── Phase 2 · Foundational (бэкенд: хранение UTM/ymClientId) ─────────────────
  - id: "T003"
    title: "Добавить поля UTM и YmClientId в доменные сущности"
    description: "Расширить TryoutRequest и ContactMessage nullable-полями UtmSource/UtmMedium/UtmCampaign/UtmContent/UtmTerm и YmClientId."
    context: "Хранилище должно фиксировать источник каждой заявки, допуская пустые значения для прямых заходов."
    story_ref: "US3"
    requirement_refs: ["FR-014"]
    depends_on: []
    parallelizable: false
    entity_refs: ["tryout_request", "contact_message"]
    contract_refs: []
    steps:
      - order: 1
        action: "Добавить свойства в TryoutRequest"
        detail: "src/backend/src/Arsenal.Domain — string? UtmSource/UtmMedium/UtmCampaign/UtmContent/UtmTerm, string? YmClientId; учесть неизменяемость/фабричные методы, если сущность их использует."
      - order: 2
        action: "Добавить те же свойства в ContactMessage"
        detail: "Аналогично в сущности ContactMessage."
    technical_notes:
      - path: "src/backend/src/Arsenal.Domain/"
        note: "Соблюсти существующий стиль сущностей (конструкторы/фабрики DDD)."
    acceptance_criteria:
      - id: "AC-1"
        description: "Обе сущности содержат 5 UTM-полей и YmClientId, все nullable."
        done: false
    test_scenarios:
      - id: "TS-1"
        given: ["Проект Arsenal.Domain"]
        when: "dotnet build src/backend"
        then: ["Сборка успешна с новыми полями"]
        verification: ["automated"]
        level: "unit"

  - id: "T004"
    title: "Проброс UTM/ymClientId через Application (Commands/DTO)"
    description: "Расширить команды создания заявок и DTO приёма полями UTM и YmClientId, передать их в сущности."
    context: "Слой приложения должен переносить метки из запроса в доменную сущность при сохранении."
    story_ref: "US3"
    requirement_refs: ["FR-013", "FR-014"]
    depends_on: ["T003"]
    parallelizable: false
    entity_refs: ["tryout_request", "contact_message"]
    contract_refs: ["post_tryout", "post_contact"]
    steps:
      - order: 1
        action: "Расширить команды"
        detail: "src/backend/src/Arsenal.Application — в Command/Handler создания TryoutRequest и ContactMessage добавить UTM + YmClientId и присвоить сущностям."
      - order: 2
        action: "Расширить DTO"
        detail: "Добавить поля в request-DTO согласно contracts post_tryout/post_contact (utmSource..utmTerm, ymClientId), все optional."
    technical_notes:
      - path: "src/backend/src/Arsenal.Application/"
        note: "Commands/DTO; FluentValidation — новые поля необязательные, без строгой валидации."
    acceptance_criteria:
      - id: "AC-1"
        description: "Команды и DTO принимают UTM/ymClientId и передают их в сохраняемую сущность."
        done: false
    test_scenarios:
      - id: "TS-1"
        given: ["Команда создания заявки с UTM"]
        when: "Handler выполнен"
        then: ["Сущность сохранена с переданными метками"]
        verification: ["automated"]
        level: "integration"

  - id: "T005"
    title: "EF-конфигурация и миграция AddUtmAndYmClientId"
    description: "Настроить маппинг новых полей и создать одну EF Core миграцию, добавляющую колонки в обе таблицы."
    context: "Новые поля должны появиться в PostgreSQL без потери существующих данных."
    story_ref: "US3"
    requirement_refs: ["FR-014"]
    depends_on: ["T003"]
    parallelizable: false
    entity_refs: ["tryout_request", "contact_message"]
    contract_refs: []
    steps:
      - order: 1
        action: "Обновить EF-конфигурацию"
        detail: "src/backend/src/Arsenal.Infrastructure — в конфигурациях сущностей отметить новые колонки nullable (при явном маппинге)."
      - order: 2
        action: "Создать миграцию"
        detail: "dotnet ef migrations add AddUtmAndYmClientId --project src/backend/src/Arsenal.Infrastructure."
      - order: 3
        action: "Проверить SQL миграции"
        detail: "Убедиться, что генерируются nullable-колонки для обеих таблиц; применить dotnet ef database update локально."
    technical_notes:
      - path: "src/backend/src/Arsenal.Infrastructure/"
        note: "DbContext + Migrations; на проде миграция применяется при деплое/DbInitializer."
    acceptance_criteria:
      - id: "AC-1"
        description: "Миграция добавляет 6 nullable-колонок в TryoutRequests и ContactMessages, существующие строки сохраняются."
        done: false
    test_scenarios:
      - id: "TS-1"
        given: ["БД с прежней схемой"]
        when: "Применена миграция AddUtmAndYmClientId"
        then: ["Колонки UTM/YmClientId присутствуют", "Старые записи не потеряны"]
        verification: ["manual"]
        level: "integration"

  - id: "T006"
    title: "Приём UTM/ymClientId в ContactController"
    description: "Принять новые поля в POST /api/tryout и POST /api/contact и передать в команды; сохранить возврат { id } как сигнал успеха."
    context: "API — граница, через которую метки попадают в хранилище; контракт успеха (GUID) остаётся прежним."
    story_ref: "US3"
    requirement_refs: ["FR-013", "FR-014", "FR-016"]
    depends_on: ["T004"]
    parallelizable: false
    entity_refs: ["tryout_request", "contact_message"]
    contract_refs: ["post_tryout", "post_contact"]
    steps:
      - order: 1
        action: "Расширить модели запроса контроллера"
        detail: "src/backend/src/Arsenal.API/Controllers/ContactController.cs — добавить UTM/ymClientId в обе request-модели."
      - order: 2
        action: "Передать в команды"
        detail: "Прокинуть новые поля в MediatR-команды создания; ответ created по-прежнему { id, message }."
    technical_notes:
      - path: "src/backend/src/Arsenal.API/Controllers/ContactController.cs"
        note: "POST api/tryout и api/contact; id = GUID заявки (сигнал успеха для клиента)."
    acceptance_criteria:
      - id: "AC-1"
        description: "Оба эндпоинта принимают UTM/ymClientId и возвращают { id } при created."
        done: false
    test_scenarios:
      - id: "TS-1"
        given: ["POST /api/tryout с UTM-полями"]
        when: "Запрос обработан успешно"
        then: ["Ответ содержит id (GUID)", "Заявка в БД содержит UTM"]
        verification: ["manual"]
        level: "e2e"

  - id: "T007"
    title: "Показ UTM-меток в админке"
    description: "Отобразить сохранённые UTM (и ym clientId) рядом с каждой заявкой в админ-интерфейсе."
    context: "Владелец должен видеть источник заявки, чтобы вручную довести воронку до продажи."
    story_ref: "US3"
    requirement_refs: ["FR-015"]
    depends_on: ["T006"]
    parallelizable: false
    entity_refs: ["tryout_request", "contact_message"]
    contract_refs: []
    steps:
      - order: 1
        action: "Пробросить UTM в admin API/response"
        detail: "Добавить UTM/ymClientId в DTO/ответ списка заявок, используемый админкой."
      - order: 2
        action: "Отрисовать в админ-таблице/карточке"
        detail: "Показать utm_source/medium/campaign (и остальные при наличии) рядом с заявкой во фронтовой админке."
    technical_notes:
      - path: "src/frontend/src/app/"
        note: "Страница/раздел админки со списком заявок — добавить колонки/поля UTM."
    acceptance_criteria:
      - id: "AC-1"
        description: "В админке для заявки с UTM метки видны; для прямого захода поля пусты без ошибок."
        done: false
    test_scenarios:
      - id: "TS-1"
        given: ["Заявка с utm_source=test в БД"]
        when: "Администратор открывает список заявок"
        then: ["UTM отображаются рядом с заявкой"]
        verification: ["manual"]
        level: "e2e"

  # ───────────────────────── Phase 3 · US1 (P1, главная конверсия) ─────────────────────────
  - id: "T008"
    title: "Проброс UTM/ymClientId в payload заявок (api.ts)"
    description: "Дополнить submitTryoutRequest и submitContactMessage метками из getStoredUtm() и ym clientId перед отправкой."
    context: "Метки, захваченные на фронте, должны уходить на сервер вместе с заявкой."
    story_ref: "US1"
    requirement_refs: ["FR-013"]
    depends_on: ["T002"]
    parallelizable: false
    entity_refs: ["tryout_request", "contact_message"]
    contract_refs: ["post_tryout", "post_contact"]
    steps:
      - order: 1
        action: "Дополнить payload"
        detail: "src/frontend/src/lib/api.ts — в submitTryoutRequest и submitContactMessage добавить в тело getStoredUtm() и ym clientId (getYmClientId из lib/analytics.ts)."
      - order: 2
        action: "Не блокировать отправку"
        detail: "Если clientId недоступен — отправлять пустую строку, заявку не задерживать (EC-4, FR-018)."
    technical_notes:
      - path: "src/frontend/src/lib/api.ts"
        note: "Функции возвращают boolean(res.ok) — контракт успеха сохранить."
    acceptance_criteria:
      - id: "AC-1"
        description: "Payload обоих запросов содержит UTM-поля и ymClientId (возможно пустые)."
        done: false
    test_scenarios:
      - id: "TS-1"
        given: ["Cookie utm_ft со source=test"]
        when: "Вызвана submitTryoutRequest"
        then: ["Тело запроса содержит utmSource=test"]
        verification: ["automated"]
        level: "integration"

  - id: "T009"
    title: "Событие trial_form_submit (success-only) в TryoutForm"
    description: "Вызывать reachGoal('trial_form_submit', {leadId}) строго в ветке успеха отправки заявки на пробную."
    context: "Главная конверсия должна считаться только при реальном сохранении заявки на сервере."
    story_ref: "US1"
    requirement_refs: ["FR-003", "FR-004", "FR-016"]
    depends_on: ["T001", "T008"]
    parallelizable: false
    entity_refs: ["analytics_goal", "tryout_request"]
    contract_refs: ["post_tryout", "reach_goal"]
    steps:
      - order: 1
        action: "Вернуть id из api.ts"
        detail: "При необходимости расширить submitTryoutRequest, чтобы отдать { ok, id } (leadId) для params цели."
      - order: 2
        action: "Вызвать reachGoal в if(ok)"
        detail: "src/frontend/src/components/TryoutForm.tsx — внутри существующей ветки успеха (setSuccess(true)) вызвать reachGoal('trial_form_submit', { leadId: id })."
      - order: 3
        action: "Гарантировать один вызов"
        detail: "Событие ровно один раз на одну успешную отправку; блокировать повторный сабмит при in-flight (EC-5)."
    technical_notes:
      - path: "src/frontend/src/components/TryoutForm.tsx"
        note: "Уже есть if(ok) setSuccess(true) — точка вставки события."
    acceptance_criteria:
      - id: "AC-1"
        description: "Цель trial_form_submit срабатывает только после успеха сервера и несёт leadId."
        done: false
      - id: "AC-2"
        description: "При ошибке сервера/клике по кнопке цель не срабатывает."
        done: false
    test_scenarios:
      - id: "TS-1"
        given: ["Валидная форма на /zapisatsya"]
        when: "Отправка успешна (res.ok)"
        then: ["trial_form_submit достигнута один раз", "В params есть leadId"]
        verification: ["manual"]
        level: "e2e"
      - id: "TS-2"
        given: ["Сервер возвращает ошибку"]
        when: "Форма отправлена"
        then: ["trial_form_submit не достигнута"]
        verification: ["manual"]
        level: "integration"

  # ───────────────────────── Phase 4 · US2 (P1, активация счётчика) ─────────────────────────
  - id: "T010"
    title: "Включить Вебвизор и карты в инициализации счётчика (Analytics.tsx)"
