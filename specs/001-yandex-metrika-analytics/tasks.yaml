        verification: ["manual"]
        level: "e2e"

  - id: "T012"
    title: "Событие trial_form_open при показе формы"
    description: "Вызывать reachGoal('trial_form_open') один раз при монтировании формы пробной тренировки."
    context: "Заказчик определил показ формы как её отображение на странице (mount)."
    story_ref: "US4"
    requirement_refs: ["FR-005"]
    depends_on: ["T001"]
    parallelizable: false
    entity_refs: ["analytics_goal"]
    contract_refs: ["reach_goal"]
    steps:
      - order: 1
        action: "Добавить useEffect на mount"
        detail: "src/frontend/src/components/TryoutForm.tsx — useEffect([], ...) с reachGoal('trial_form_open'); guard от повторного вызова в StrictMode (ref)."
