feature: "Яндекс.Метрика и сквозная веб-аналитика воронки заявок fcarsenal92.ru"
branch: "001-yandex-metrika-analytics"
created: "2026-08-31"
status: "Draft"
input: |
  Интеграция Яндекс.Метрики и сквозной веб-аналитики на сайте fcarsenal92.ru (Next.js 15 фронт + .NET 9 бэк + PostgreSQL).
  ЦЕЛЬ: связать рекламный источник с заявкой и далее с реальным клиентом. Базовая рабочая аналитика воронки:
  источник трафика → сайт → заявка → пробная тренировка → покупка абонемента (последние два фиксируются офлайн отдельно).
  События reachGoal: trial_form_submit, trial_form_open, phone_click (place: header/contacts/footer/other),
  map_click, other_lead_submit, sponsor_click, sponsor_form_submit. Все submit-события — только при реально успешной
  отправке (не по клику кнопки). Активировать счётчик + Вебвизор, карту кликов, карту скроллинга, аналитику форм.
  UTM: хранить полноценно в БД (utm_source/medium/campaign/content/term + ym clientId в TryoutRequest и ContactMessage),
  захват на фронте (first-touch cookie), проброс в payload и показ в админке. Добавить на /kontakty кнопки Яндекс.Карты и 2ГИС.
  ВНЕ ОБЪЁМА: не отслеживать каждую кнопку; офлайн-этапы (пробная проведена, покупка абонемента) — отдельно.

user_stories:
  - id: "US1"
    title: "Владелец видит заявки на пробную тренировку как главную конверсию с привязкой к источнику"
    priority: "P1"
    description: >
      Как владелец клуба, я хочу видеть в аналитике каждую успешно отправленную заявку на пробную тренировку
      как достигнутую цель с рекламным источником, чтобы понимать, какие кампании приводят реальные заявки.
    motivation:
      problem: "Заявки на пробную сейчас нигде не считаются как конверсия; невозможно связать рекламу с результатом."
      value: "Появляется измеримая главная конверсия воронки и понимание отдачи рекламных каналов."
      consequence_if_skipped: "Рекламный бюджет тратится вслепую, без данных об эффективности источников."
    why_priority: "Это основная бизнес-цель всей задачи — измеримая заявка на пробную тренировку."
    independent_test: "Отправить тестовую заявку с /zapisatsya с UTM-меткой и убедиться, что цель зафиксирована с источником."
    acceptance_scenarios:
      - id: "AS-1"
        given: "Посетитель заполнил форму пробной тренировки корректными данными"
        when: "Сервер подтвердил успешное сохранение заявки"
        then: "В аналитике фиксируется достижение главной цели (успешная заявка на пробную)"
      - id: "AS-2"
        given: "Посетитель нажал кнопку отправки, но сервер вернул ошибку"
        when: "Заявка не сохранилась"
        then: "Цель НЕ фиксируется (событие только на реальный успех)"
    acceptance_criteria:
      - id: "AC-1"
        description: "Событие успешной заявки на пробную срабатывает строго после подтверждения успеха от сервера."
        done: false
      - id: "AC-2"
        description: "Событие не срабатывает при ошибке отправки или при простом клике по кнопке."
        done: false
      - id: "AC-3"
        description: "Событие несёт идентификатор заявки и рекламный источник (UTM) для сквозной связки."
        done: false
    test_scenarios:
      - id: "TS-1"
        given:
          - "Форма пробной тренировки на /zapisatsya"
          - "Заполнены валидные данные ребёнка и родителя"
        when: "Форма отправлена и сервер вернул успех"
        then:
          - "Цель успешной заявки достигнута ровно один раз"
          - "В параметрах цели присутствует идентификатор заявки"
        verification:
          - "manual"
        level: "e2e"
      - id: "TS-2"
        given:
          - "Форма пробной тренировки"
          - "Сервер сконфигурирован возвращать ошибку"
        when: "Форма отправлена"
        then:
          - "Цель успешной заявки НЕ достигается"
        verification:
          - "manual"
        level: "integration"

  - id: "US2"
    title: "Поведенческая аналитика работает на проде: счётчик, Вебвизор, карты, аналитика форм"
    priority: "P1"
    description: >
      Как владелец, я хочу, чтобы счётчик Метрики реально загружался на всех страницах прод-сайта с включёнными
      Вебвизором, картой кликов, картой скроллинга и аналитикой форм, чтобы собирать поведение посетителей.
    motivation:
      problem: "Счётчик подключён в коде, но идентификатор пуст — на проде аналитика фактически не собирается."
      value: "Появляется базовый сбор поведения и записи сессий для оптимизации сайта."
      consequence_if_skipped: "Нет никаких данных о посетителях; все остальные цели бесполезны без работающего счётчика."
    why_priority: "Без активного счётчика ни одна цель воронки не собирает данные."
    independent_test: "Открыть прод-сайт и убедиться, что счётчик загружается и визиты появляются в отчётах Метрики."
    acceptance_scenarios:
      - id: "AS-1"
        given: "Идентификатор счётчика задан в окружении прода"
        when: "Посетитель открывает любую страницу сайта"
        then: "Счётчик загружается и визит регистрируется с включёнными Вебвизором, картой кликов/скроллинга и аналитикой форм"
    acceptance_criteria:
      - id: "AC-1"
        description: "На всех прод-страницах присутствует и инициализируется счётчик с корректным идентификатором."
        done: false
      - id: "AC-2"
        description: "Вебвизор, карта кликов, карта скроллинга и аналитика форм включены в инициализации счётчика."
        done: false
    test_scenarios:
      - id: "TS-1"
        given:
          - "Прод-сайт с заданным идентификатором счётчика"
        when: "Загружается главная страница"
        then:
          - "Скрипт счётчика присутствует в ответе"
          - "Опции Вебвизора и карт включены"
        verification:
          - "manual"
        level: "e2e"

  - id: "US3"
    title: "UTM-метки первого касания сохраняются с каждой заявкой и видны в админке"
    priority: "P1"
    description: >
      Как владелец, я хочу, чтобы рекламные метки (UTM) первого касания сохранялись в базе вместе с каждой заявкой
      и идентификатором посетителя Метрики, и отображались в админке рядом с заявкой.
    motivation:
      problem: "UTM-метки нигде не захватываются и не сохраняются — заявку невозможно связать с кампанией офлайн."
      value: "Каждая заявка получает источник, что позволяет вручную довести воронку до продажи абонемента."
      consequence_if_skipped: "Связь 'реклама → заявка → клиент' рвётся; сквозная аналитика невозможна."
    why_priority: "Хранение источника с заявкой — фундамент сквозной аналитики, требуемой заказчиком."
    independent_test: "Зайти с UTM-ссылкой, отправить заявку, проверить, что метки сохранены в БД и показаны в админке."
    acceptance_scenarios:
      - id: "AS-1"
        given: "Посетитель пришёл по ссылке с UTM-метками"
        when: "Позже он отправляет заявку (пробная или прочая)"
        then: "Метки первого касания и идентификатор посетителя сохраняются вместе с заявкой"
      - id: "AS-2"
        given: "Заявка с сохранёнными UTM"
        when: "Администратор открывает список заявок"
        then: "UTM-метки отображаются рядом с заявкой"
    acceptance_criteria:
      - id: "AC-1"
        description: "UTM-метки (source/medium/campaign/content/term) и идентификатор посетителя сохраняются в записи заявки."
        done: false
      - id: "AC-2"
        description: "Применяется модель первого касания (первый источник не перетирается последующими визитами)."
        done: false
      - id: "AC-3"
        description: "Сохранённые метки видны администратору вместе с заявкой."
        done: false
      - id: "AC-4"
        description: "Заявка без UTM (прямой заход) сохраняется корректно с пустыми метками."
        done: false
    test_scenarios:
      - id: "TS-1"
        given:
          - "Открыт URL с параметрами utm_source/medium/campaign"
          - "Форма заявки заполнена"
        when: "Заявка успешно отправлена"
        then:
          - "В хранилище у заявки присутствуют переданные UTM-метки"
          - "У заявки присутствует идентификатор посетителя"
        verification:
          - "manual"
        level: "e2e"
      - id: "TS-2"
        given:
          - "Первый визит с utm_source=A"
          - "Повторный визит с utm_source=B без очистки хранилища"
        when: "Заявка отправлена во втором визите"
        then:
          - "Сохранён источник A (первое касание)"
        verification:
          - "manual"
        level: "integration"

  - id: "US4"
    title: "Отслеживание вспомогательных точек контакта: телефон, карты, показ формы"
    priority: "P2"
    description: >
      Как владелец, я хочу видеть, как часто посетители кликают по телефону (с указанием места на сайте),
      переходят к картам и видят форму пробной, чтобы оценивать микро-конверсии воронки.
    motivation:
      problem: "Клики по телефону, переходы к картам и показы формы никак не измеряются."
      value: "Появляется картина микро-конверсий и намерений, дополняющая главную цель."
      consequence_if_skipped: "Часть офлайн-обращений (звонки, визиты по карте) остаётся невидимой в аналитике."
    why_priority: "Полезно для полноты воронки, но вторично относительно главной конверсии и счётчика."
    independent_test: "Кликнуть по телефону в шапке/подвале/контактах, по кнопке карты, открыть страницу с формой — проверить цели."
    acceptance_scenarios:
      - id: "AS-1"
        given: "Посетитель на странице с телефоном"
        when: "Он кликает по номеру телефона"
        then: "Фиксируется цель клика по телефону с параметром места (шапка/контакты/подвал/прочее)"
      - id: "AS-2"
        given: "Посетитель на странице контактов"
        when: "Он нажимает кнопку перехода к Яндекс.Картам или 2ГИС"
        then: "Фиксируется цель перехода к картам"
      - id: "AS-3"
        given: "Посетитель открывает страницу с формой пробной"
        when: "Форма отображается на странице"
        then: "Фиксируется цель показа формы"
    acceptance_criteria:
      - id: "AC-1"
        description: "Клик по любой tel:-ссылке фиксирует цель клика по телефону с параметром места."
        done: false
      - id: "AC-2"
        description: "На странице контактов есть кнопки перехода к Яндекс.Картам и 2ГИС, клик по ним фиксирует цель карты."
        done: false
      - id: "AC-3"
        description: "Показ формы пробной на странице фиксирует цель показа формы один раз за просмотр страницы."
        done: false
    test_scenarios:
      - id: "TS-1"
        given:
          - "Страница контактов с телефоном и кнопками карт"
        when: "Клик по телефону, затем по кнопке карты"
        then:
          - "Достигнута цель телефона с местом 'contacts'"
          - "Достигнута цель перехода к картам"
        verification:
          - "manual"
        level: "e2e"

  - id: "US5"
    title: "Прочие и спонсорские заявки считаются как отдельные цели, спонсорская форма чинится"
    priority: "P2"
    description: >
      Как владелец, я хочу отдельно считать успешные заявки на прочие направления (PRO, сборы, стажировки)
      и спонсорские обращения, а также клики по кнопке спонсорства, при этом спонсорская форма должна показывать
      успех только при реальном сохранении.
    motivation:
      problem: "Прочие и спонсорские заявки не выделены как цели; спонсорская форма показывает успех даже при ошибке сервера."
      value: "Полная воронка обращений и корректная обратная связь пользователю по спонсорской форме."
      consequence_if_skipped: "Часть лидов не считается; спонсоры получают ложное подтверждение при сбое."
    why_priority: "Дополняет воронку, но объём этих обращений меньше основной конверсии."
    independent_test: "Отправить общую заявку и спонсорскую заявку, кликнуть по кнопке спонсорства — проверить цели и поведение при ошибке."
    acceptance_scenarios:
      - id: "AS-1"
        given: "Посетитель заполнил общую форму (прочее направление)"
        when: "Сервер подтвердил успех"
        then: "Фиксируется цель прочей заявки"
      - id: "AS-2"
        given: "Посетитель нажал кнопку 'Стать генеральным спонсором'"
        when: "Открывается спонсорская форма"
        then: "Фиксируется цель клика по спонсорству"
      - id: "AS-3"
        given: "Спонсорская форма отправлена, но сервер вернул ошибку"
        when: "Ответ обработан"
        then: "Экран успеха НЕ показывается и цель спонсорской заявки НЕ фиксируется"
    acceptance_criteria:
      - id: "AC-1"
        description: "Успешная отправка общей формы фиксирует цель прочей заявки только при подтверждении сервера."
        done: false
      - id: "AC-2"
        description: "Клик по кнопке спонсорства фиксирует цель клика по спонсорству."
        done: false
      - id: "AC-3"
        description: "Спонсорская форма показывает успех и фиксирует цель только при реально успешном сохранении."
        done: false
    test_scenarios:
      - id: "TS-1"
        given:
          - "Спонсорская форма"
          - "Сервер возвращает ошибку"
        when: "Форма отправлена"
        then:
          - "Экран успеха не показан"
          - "Цель спонсорской заявки не достигнута"
        verification:
          - "manual"
        level: "integration"
      - id: "TS-2"
        given:
          - "Общая форма прочего направления"
        when: "Форма успешно отправлена"
        then:
          - "Достигнута цель прочей заявки"
        verification:
          - "manual"
        level: "e2e"

edge_cases:
  - id: "EC-1"
    description: "Посетитель с блокировщиком рекламы/скриптов, где счётчик не загрузился."
    expected_behavior: "Отправка заявки и её сохранение работают штатно; события аналитики просто не отправляются, ошибок на сайте нет."
  - id: "EC-2"
    description: "Посетитель отправляет несколько заявок в одном визите (повторная отправка)."
    expected_behavior: "Каждая успешная заявка фиксирует цель отдельно; UTM первого касания остаются неизменными."
  - id: "EC-3"
    description: "Прямой заход без UTM-меток."
    expected_behavior: "Заявка сохраняется с пустыми UTM-полями; аналитика источника показывает прямой/органический трафик."
  - id: "EC-4"
    description: "UTM-метки присутствуют, но идентификатор посетителя Метрики недоступен (счётчик не готов)."
    expected_behavior: "Заявка сохраняется с UTM и пустым идентификатором посетителя; отправка не блокируется."
  - id: "EC-5"
    description: "Двойной клик по кнопке отправки формы."
    expected_behavior: "Заявка не дублируется; цель фиксируется один раз на одну успешную заявку."

functional_requirements:
  - id: "FR-001"
    text: "Система MUST загружать и инициализировать счётчик веб-аналитики на всех страницах прод-сайта при заданном идентификаторе счётчика."
    story_refs: ["US2"]
  - id: "FR-002"
    text: "Счётчик MUST инициализироваться с включёнными Вебвизором, картой кликов, картой скроллинга и аналитикой форм."
    story_refs: ["US2"]
  - id: "FR-003"
    text: "WHEN сервер подтверждает успешное сохранение заявки на пробную тренировку, система MUST зафиксировать главную цель конверсии ровно один раз."
    story_refs: ["US1"]
  - id: "FR-004"
    text: "Система MUST NOT (SHALL NOT) фиксировать цель отправки формы при клике по кнопке или при ошибке сервера — только при реально успешном сохранении."
    story_refs: ["US1", "US5"]
  - id: "FR-005"
    text: "WHEN форма пробной тренировки отображается на странице, система MUST зафиксировать цель показа формы один раз за просмотр страницы."
    story_refs: ["US4"]
  - id: "FR-006"
    text: "WHEN посетитель кликает по tel:-ссылке, система MUST зафиксировать цель клика по телефону с параметром места (шапка, контакты, подвал, прочее)."
    story_refs: ["US4"]
  - id: "FR-007"
    text: "Система MUST предоставлять на странице контактов кнопки перехода к Яндекс.Картам и 2ГИС и фиксировать цель перехода к картам при клике по ним."
    story_refs: ["US4"]
  - id: "FR-008"
    text: "WHEN сервер подтверждает успешную отправку общей формы (прочие направления), система MUST зафиксировать цель прочей заявки."
    story_refs: ["US5"]
  - id: "FR-009"
    text: "WHEN посетитель открывает спонсорскую форму по кнопке спонсорства, система MUST зафиксировать цель клика по спонсорству."
    story_refs: ["US5"]
  - id: "FR-010"
    text: "Спонсорская форма MUST показывать экран успеха и фиксировать цель спонсорской заявки только при реально успешном сохранении на сервере."
    story_refs: ["US5"]
  - id: "FR-011"
    text: "Система MUST захватывать UTM-метки (source, medium, campaign, content, term) из адреса при первом касании и сохранять их для последующей отправки заявки."
    story_refs: ["US3"]
  - id: "FR-012"
    text: "Модель захвата UTM MUST быть 'первое касание' — первый источник не перезаписывается последующими визитами в пределах срока хранения."
    story_refs: ["US3"]
  - id: "FR-013"
    text: "Система MUST передавать сохранённые UTM-метки и идентификатор посетителя веб-аналитики вместе с каждой заявкой (пробная и прочая) на сервер."
    story_refs: ["US3"]
  - id: "FR-014"
    text: "Хранилище заявок MUST сохранять UTM-метки и идентификатор посетителя в записи заявки (пробная и прочая), допуская пустые значения при их отсутствии."
    story_refs: ["US3"]
  - id: "FR-015"
    text: "Администратор MUST видеть сохранённые UTM-метки рядом с соответствующей заявкой в админке."
    story_refs: ["US3"]
  - id: "FR-016"
    text: "События целей конверсии MUST нести идентификатор заявки для сквозной связки источник → заявка → клиент."
    story_refs: ["US1"]
  - id: "FR-017"
    text: "Существующая корректная работа UTM-меток в рекламных переходах MUST быть сохранена (метки не теряются на входе на сайт)."
    story_refs: ["US3"]
  - id: "FR-018"
    text: "WHEN счётчик недоступен (блокировщик/сбой загрузки), отправка и сохранение заявок MUST продолжать работать без ошибок для пользователя."
    story_refs: ["US1", "US5"]
    category: "non_functional"
  - id: "FR-019"
    text: "Имена целей веб-аналитики MUST совпадать с согласованным списком идентификаторов (trial_form_submit, trial_form_open, phone_click, map_click, other_lead_submit, sponsor_click, sponsor_form_submit) для передачи заказчику."
    story_refs: ["US1", "US4", "US5"]

key_entities:
  - id: "E-1"
    name: "Заявка на пробную тренировку"
    description: "Обращение родителя на пробное занятие; главная конверсия. Дополняется UTM-метками и идентификатором посетителя."
  - id: "E-2"
    name: "Общая заявка / сообщение"
    description: "Обращение по прочим направлениям (PRO, сборы, стажировки) и спонсорству. Дополняется UTM-метками и идентификатором посетителя."
  - id: "E-3"
    name: "UTM-метки первого касания"
    description: "Набор source/medium/campaign/content/term, захваченный при первом визите и хранимый до отправки заявки."
  - id: "E-4"
    name: "Цель веб-аналитики (событие reachGoal)"
    description: "Именованное событие конверсии/микро-конверсии, передаваемое в систему аналитики с параметрами (место, идентификатор заявки)."
  - id: "E-5"
    name: "Идентификатор посетителя веб-аналитики"
    description: "Идентификатор клиента системы аналитики, связывающий поведение посетителя с сохранённой заявкой."

success_criteria:
  - id: "SC-1"
    description: "Счётчик активен на 100% прод-страниц и визиты отображаются в отчётах системы аналитики."
    measurable_via: "Проверка загрузки счётчика на ключевых страницах и появление визитов в отчёте за сутки."
  - id: "SC-2"
    description: "Тестовая заявка на пробную фиксируется как достигнутая главная цель с корректным источником."
    measurable_via: "Ручной прогон тестовой заявки с UTM и проверка достижения цели в отчёте с привязкой источника."
  - id: "SC-3"
    description: "Все 7 согласованных целей присутствуют и срабатывают в соответствующих сценариях."
    measurable_via: "Чек-лист ручной проверки каждой цели с фиксацией достижения в системе аналитики."
  - id: "SC-4"
    description: "Ни одно submit-событие не срабатывает без реально успешного сохранения заявки."
    measurable_via: "Сценарий с принудительной ошибкой сервера: цель не достигается."
  - id: "SC-5"
    description: "100% успешных заявок сохраняют переданные UTM-метки и видны с ними в админке."
    measurable_via: "Проверка записей заявок в хранилище и отображения UTM в админке для тестовых заявок с метками."
  - id: "SC-6"
    description: "Заявитель по спонсорской форме получает подтверждение успеха только при реальном сохранении."
    measurable_via: "Сценарий ошибки сервера для спонсорской формы: экран успеха не показан."

assumptions:
  - id: "A-1"
    description: "Номер счётчика и доступы предоставляет заказчик (SMM) в конце; код реализуется заранее и активируется настройкой окружения."
  - id: "A-2"
    description: "Идентификаторы целей в системе аналитики создаются с именами, совпадающими с именами событий."
  - id: "A-3"
    description: "Офлайн-этапы воронки (проведение пробной, покупка абонемента) фиксируются вне этой задачи."
  - id: "A-4"
    description: "Срок хранения UTM первого касания — стандартный для маркетинговой атрибуции (порядка нескольких месяцев)."
  - id: "A-5"
    description: "Настройки Вебвизора/карт/аналитики форм в кабинете аналитики включает владелец счётчика; код лишь запрашивает их в инициализации."
