feature: "Надёжная сессия админки (обновление токена и корректный выход)"
slices:
  - id: "S1"
    title: "admin-session-wrapper"
    depends_on: []
    tasks: ["T001", "T002", "T003", "T004"]
    scenario_refs:
      - "US1-AS-1"
      - "US1-AS-2"
      - "US1-TS-1"
      - "US1-TS-2"
      - "US1-EC-1"
      - "US1-EC-2"
      - "US1-EC-4"
      - "US2-AS-3"
      - "US2-AS-4"
      - "US2-AS-5"
      - "US2-TS-3"
      - "US2-TS-4"
      - "US2-EC-3"
      - "US2-EC-3b"
    rationale: >
      Единственный слайс. T001 (модуль adminAuth.ts: хранилище + adminFetch +
      single-flight refresh + terminateSession) — общее ядро; T002 (тесты) и
      T003 (перевод api.ts) оба зависят от T001 и не дают независимой ценности
      без него — T003 без T001 нечего переключать, T002 без T001 нечего
      тестировать. T004 (login/page.tsx + AdminLayout.tsx) зависит только от
      T001 и помечен parallelizable в tasks.yaml, но реализует FR-005/FR-006,
      без которых сценарии US2-AS-4/AS-5 непроверяемы — то есть даже T004
      не является самостоятельно поставляемым слайсом: вся фича описывает
      ОДНО сквозное поведение (adminFetch как единственная точка правды для
      сессии), наблюдаемое только когда все четыре задачи внедрены вместе.
      Дробление привело бы к промежуточным состояниям, не проходящим ни один
      acceptance-сценарий целиком.
