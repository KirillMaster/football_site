services:
  nextjs:
    image: ghcr.io/${GITHUB_REPOSITORY:-kirillmaster/football_site}/nextjs:${IMAGE_TAG:-latest}
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=https://fcarsenal92.ru
      - API_INTERNAL_URL=http://dotnet-api:5000
      - NEXT_PUBLIC_GA_ID=${NEXT_PUBLIC_GA_ID}
      - NEXT_PUBLIC_YM_ID=${NEXT_PUBLIC_YM_ID}
    env_file:
      - .env
    depends_on:
      dotnet-api:
        condition: service_healthy
    restart: unless-stopped
    # autoheal restarts this container if it becomes unhealthy (e.g. event-loop hang)
    labels:
      - autoheal=true
    # override the image's baked healthcheck (/api/health — 404 on the Next.js frontend);
    # hit /, which the frontend serves 200. busybox wget: use -qO- (no --spider).
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Hardening: prevent RCE from writing/executing droppers
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /home/nextjs/.next/cache:rw,nosuid,nodev,size=128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  dotnet-api:
    image: ghcr.io/${GITHUB_REPOSITORY:-kirillmaster/football_site}/dotnet-api:${IMAGE_TAG:-latest}
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      - ASPNETCORE_URLS=http://+:5000
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET=${S3_BUCKET}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - FRONTEND_URL=${FRONTEND_URL:-https://fcarsenal92.ru}
      - SEED_DATA_PATH=/app/seed-data.json
    env_file:
      - .env
    volumes:
      - uploads_data:/app/uploads
      - ./config/seed-data.json:/app/seed-data.json:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 120s

  # Watches containers labelled autoheal=true and restarts them when unhealthy.
  # Fixes the failure mode where Next.js hung (event loop stuck) but never exited,
  # so `restart: unless-stopped` alone did not recover it.
  autoheal:
    image: willfarrell/autoheal:latest
    restart: unless-stopped
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=15
      - AUTOHEAL_START_PERIOD=60
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    security_opt:
      - no-new-privileges:true

volumes:
  uploads_data:
