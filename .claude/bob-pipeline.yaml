# bob-pipeline configuration — instantiated by /bob-init
# Двухстековый проект: фронт typescript (Next.js 15), бэк csharp (.NET 9).
# Верхнеуровневый stack — метка; фактический выбор инструментов per-slice по tools[].stack.
# Mutation-тесты отключены по решению пользователя.
version: "1"
project_name: "football_site"
stack: "typescript+csharp"

roles:
  - name: specifier
    model: sonnet
    enabled: true
    gates: [gherkin-traceability]
  - name: coder
    model: sonnet
    enabled: true
    gates: [tests-green]
  - name: cleaner
    model: sonnet
    enabled: true
    gates: [tests-green, complexity-baseline, duplication-baseline]
  - name: architect
    model: sonnet
    enabled: true
    gates: [tests-green]
  - name: hardener
    model: haiku
    enabled: true
    gates: [tests-green]
    degradation: "mutation отключён в конфиге: только эвристическое усиление тестов (граничные значения, ветки ошибок, null/empty); фиксируется как deviation"
  - name: qa
    model: haiku
    enabled: true
    gates: [tests-green, gherkin-traceability]

tools:
  - stack: typescript
    category: coverage
    tool: runner-coverage
    run_command: "npx vitest run --coverage --coverage.reporter=lcov || npx jest --coverage --coverageReporters=lcov"
    report_parser: lcov
    enabled: true
  - stack: csharp
    category: coverage
    tool: coverlet
    run_command: "dotnet test --collect:\"XPlat Code Coverage\""
    report_parser: cobertura
    enabled: true
  - stack: any
    category: complexity
    tool: lizard
    run_command: "python -m lizard --csv ."
    report_parser: lizard
    enabled: true
  - stack: any
    category: duplication
    tool: jscpd
    run_command: "npx jscpd --reporters json --output .bob/reports ."
    report_parser: jscpd
    enabled: true
  - stack: typescript
    category: mutation
    tool: StrykerJS
    run_command: "npx stryker run --reporters json"
    report_parser: stryker
    enabled: false
  - stack: csharp
    category: mutation
    tool: Stryker.NET
    run_command: "dotnet stryker --reporter json --mutate <SliceFilesGlob> --test-project <ScopedTestProject> --timeout-ms 60000 --concurrency 4"
    report_parser: stryker
    enabled: false

human_gates:
  gherkin_approval: true
  final_qa_report: true

thresholds:
  mutation_score_min: 80
  coverage_policy: informational
  complexity_policy: not-worse-than-baseline
  duplication_policy: not-worse-than-baseline

send_back_routes:
  qa: coder
  architect: [cleaner, coder]

return_limit: 3
parallel_limit: 3

night_mode_default: false
