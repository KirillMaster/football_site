# FC Arsenal-92 — nginx vhost
# Deploy to: /etc/nginx/sites-available/fcarsenal92.ru
# Then: ln -s /etc/nginx/sites-available/fcarsenal92.ru /etc/nginx/sites-enabled/
# Then: certbot --nginx -d fcarsenal92.ru -d www.fcarsenal92.ru

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=arsenal_contact:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=arsenal_tryout:10m  rate=10r/m;
limit_req_zone $binary_remote_addr zone=arsenal_login:10m   rate=5r/m;
# General flood protection for the whole site (page + static asset bursts allowed)
limit_req_zone  $binary_remote_addr zone=arsenal_general:10m rate=15r/s;
limit_conn_zone $binary_remote_addr zone=arsenal_conn:10m;

# WAF-lite: known malicious scanner/exploit user-agents
map $http_user_agent $arsenal_bad_ua {
    default 0;
    "~*(libredtail|zgrab|masscan|nikto|sqlmap|nmap|dirbuster|wpscan|xmrig|hello,?\s*world)" 1;
}
# WAF-lite: exploit signatures in the query string (LFI/RCE/SQLi probes)
map $args $arsenal_bad_args {
    default 0;
    "~*(allow_url_include|auto_prepend_file|php://|data://|base64_decode|\.\./\.\./|union[^a-z]+select|/etc/passwd)" 1;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name fcarsenal92.ru www.fcarsenal92.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://fcarsenal92.ru$request_uri;
    }
}

# www → non-www redirect
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.fcarsenal92.ru;

    ssl_certificate     /etc/letsencrypt/live/fcarsenal92.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fcarsenal92.ru/privkey.pem;

    return 301 https://fcarsenal92.ru$request_uri;
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fcarsenal92.ru;

    ssl_certificate     /etc/letsencrypt/live/fcarsenal92.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fcarsenal92.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache   shared:SSL_arsenal:10m;
    ssl_session_timeout 1d;
    ssl_stapling        on;
    ssl_stapling_verify on;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://mc.yandex.ru; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; media-src 'self' https://s3.twcstorage.ru; connect-src 'self' https://www.google-analytics.com https://mc.yandex.ru wss://mc.yandex.ru https://s3.twcstorage.ru; frame-src 'self' https://rutube.ru https://*.rutube.ru https://yandex.ru https://*.yandex.ru https://*.yandex.net; frame-ancestors 'none';" always;

    # WAF-lite: drop malicious scanners/exploit probes before proxying
    if ($arsenal_bad_ua)   { return 444; }
    if ($arsenal_bad_args) { return 444; }
    # Cap concurrent connections per IP (mitigates flood / slowloris-style abuse)
    limit_conn arsenal_conn 40;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml font/woff font/woff2;

    # Uploads volume
    location /uploads/ {
        alias /var/lib/docker/volumes/football_site_uploads_data/_data/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Block known attack probes / scanner targets — drop without proxying
    # /test and /adfa were the RCE vector probes against Next.js
    location ~* ^/(test|adfa|wp-admin|wp-login|wp-content|wp-includes|wordpress|xmlrpc\.php|cgi-bin|boaform|goform|GponForm|HNAP1|phpmyadmin|phpMyAdmin|/?pma|myadmin|phpunit|eval-stdin|autodiscover|owa|ecp|_?_+proxy|\.git|\.env|\.aws|\.ssh|\.vscode|sftp-config|config\.json|\.php)(/|$|\.|\?) {
        # logged (not access_log off) so fail2ban can ban repeat scanners
        return 444;
    }

    # API rate-limited endpoints
    location = /api/contact {
        limit_req zone=arsenal_contact burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5000;
        include /etc/nginx/proxy_params;
    }

    location = /api/tryout {
        limit_req zone=arsenal_tryout burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5000;
        include /etc/nginx/proxy_params;
    }

    # Admin login — strict rate limit (5 req/min, no burst)
    location = /api/admin/auth/login {
        limit_req zone=arsenal_login burst=2 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5000;
        include /etc/nginx/proxy_params;
    }

    # .NET API — all /api/* routes go to backend
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 30s;
    }

    # Next.js frontend (GET-only — no server actions; forms POST to /api/* on .NET)
    location / {
        # General flood protection: sustained 15 r/s, allow bursts for asset loads
        limit_req zone=arsenal_general burst=60 nodelay;
        limit_req_status 429;
        # The RCE flood came in as POST /. Frontend routes accept only safe methods.
        limit_except GET HEAD OPTIONS {
            deny all;
        }
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 30s;
    }
}
