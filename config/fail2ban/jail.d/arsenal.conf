# fail2ban jails — FC Arsenal-92
# Установка на сервере: скопировать в /etc/fail2ban/{filter.d,jail.d}/ и `systemctl restart fail2ban`.
# Логи nginx: /var/log/nginx/access.log (combined формат).

[arsenal-nginx-scan]
enabled  = true
port     = http,https
filter   = arsenal-nginx-scan
logpath  = /var/log/nginx/access.log
maxretry = 6
findtime = 120
bantime  = 86400
# повторные баны эскалируют срок
[arsenal-nginx-flood]
enabled  = true
port     = http,https
filter   = arsenal-nginx-flood
logpath  = /var/log/nginx/access.log
maxretry = 20
findtime = 60
bantime  = 3600
