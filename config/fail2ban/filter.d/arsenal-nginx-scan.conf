# fail2ban filter — FC Arsenal-92
# Ловит сканеров/эксплойт-пробы, которым nginx отдал 444 (WAF-lite: bad_ua/bad_args/scanner-paths),
# а также 403 (limit_except deny) — т.е. заблокированный POST/PUT-флуд по фронту.
[Definition]
failregex = ^<HOST> - \S+ \[[^\]]+\] "(?:GET|POST|PUT|HEAD|OPTIONS|DELETE|PATCH|CONNECT|[A-Z]+)[^"]*" (?:444|403)
ignoreregex =
datepattern = %%d/%%b/%%Y:%%H:%%M:%%S
